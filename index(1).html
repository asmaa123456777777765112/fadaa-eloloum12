<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2a42">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>فضاء العلوم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Tajawal:wght@400;700&display=swap">
<style>
/* Layout: one narrow reading column (max 720px) and a sticky top bar. The brand's boldness lives in one place: the navy "space" (onboarding, student picker, home hero) with Nawwar the bulb guide. */
:root{
  --bg:#fff8f2; --surface:#ffffff; --surface-2:#fdebdd;
  --ink:#1f2633; --muted:#5b6476; --line:#f0dccb;
  --blue:#0b5cc9; --blue-strong:#08479c; --on-blue:#ffffff; --blue-soft:#e4eefc;
  --orange:#f08a2e; --orange-soft:#fff0e1; --orange-ink:#9a4a06;
  --coral:#f07f55; --navy:#2c3e5c; --navy-deep:#1d2a42; --on-navy:#fff8f2; --star:#fff4c9;
  --good:#1d7447; --good-soft:#e2f4ea; --bad:#b0281f; --bad-soft:#fbe9e7;
  --cup:#eef3f9; --cup-line:#9fb3cc; --cotton:#ffffff; --water:#8cc2f2;
  --seed:#b88a4a; --seed-wet:#d4a564; --seed-rot:#6f5a3a; --root-line:#a88a50; --leaf:#3f9a4b;
  --f-body:"Baloo Bhaijaan 2",Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;
  --r-sm:10px; --r-md:18px; --r-lg:28px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b27; --surface:#1b2433; --surface-2:#222d40;
  --ink:#f5efe8; --muted:#b4bcc9; --line:#2f3b52;
  --blue:#5a9bf0; --blue-strong:#86b6f5; --on-blue:#0e1726; --blue-soft:#1b2d4a;
  --orange:#f59a45; --orange-soft:#3a2614; --orange-ink:#ffc48c;
  --coral:#e8754b; --navy:#24344f; --navy-deep:#0b1220; --on-navy:#f5efe8; --star:#fff4c9;
  --good:#6fd39b; --good-soft:#163526; --bad:#ff9a8f; --bad-soft:#3d1c1a;
  --cup:#1f2c42; --cup-line:#5d7393; --cotton:#dfe6ef; --water:#2f6aa8;
  --seed:#c49656; --seed-wet:#ddb072; --seed-rot:#7d6848; --root-line:#c9ab6c; --leaf:#5cc06a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b27; --surface:#1b2433; --surface-2:#222d40;
  --ink:#f5efe8; --muted:#b4bcc9; --line:#2f3b52;
  --blue:#5a9bf0; --blue-strong:#86b6f5; --on-blue:#0e1726; --blue-soft:#1b2d4a;
  --orange:#f59a45; --orange-soft:#3a2614; --orange-ink:#ffc48c;
  --coral:#e8754b; --navy:#24344f; --navy-deep:#0b1220; --on-navy:#f5efe8; --star:#fff4c9;
  --good:#6fd39b; --good-soft:#163526; --bad:#ff9a8f; --bad-soft:#3d1c1a;
  --cup:#1f2c42; --cup-line:#5d7393; --cotton:#dfe6ef; --water:#2f6aa8;
  --seed:#c49656; --seed-wet:#ddb072; --seed-rot:#7d6848; --root-line:#c9ab6c; --leaf:#5cc06a;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font:18px/1.7 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-body);line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:32px;font-weight:800;color:var(--blue)} h2{font-size:25px;font-weight:800;color:var(--blue)} h3{font-size:20px;font-weight:700}
p{margin:0}
a{color:var(--blue)}
button,input,textarea,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font-size:22px;font-weight:800;color:var(--blue)}
.me{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.me-chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 4px;min-height:44px;font-weight:700;font-size:16px;cursor:pointer;max-width:170px}
.me-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip svg{width:34px;height:34px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--blue)}
.icon-btn svg{width:22px;height:22px}
.nav{display:flex;gap:2px;order:3;width:100%;overflow-x:auto}
.nav button{flex:1;background:none;border:0;border-radius:var(--r-sm);padding:6px 8px;min-height:44px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
@media (min-width:700px){.nav{order:2;width:auto;margin-inline-start:auto}.nav button{flex:none}.me{margin-inline-start:0}}

main{padding-block:20px 48px}
@media (prefers-reduced-motion:no-preference){
  .enter{animation:enter .28s ease-out}
  @keyframes enter{from{opacity:.2;transform:translateY(10px)}to{opacity:1;transform:none}}
  .btn,.opt,.grade,.lesson-item,.who-card{transition:transform .12s ease,background-color .15s,border-color .15s}
  .btn:active,.opt:active:not([disabled]),.grade:active,.lesson-item:active,.who-card:active{transform:scale(.97)}
}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:15px}
.note{font-size:15px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 12px}
.flag{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.6;background:var(--orange-soft);color:var(--ink);border-radius:var(--r-sm);padding:8px 12px}
.flag b{color:var(--orange-ink)}
.eyebrow{font-size:15px;font-weight:800;color:var(--orange-ink);letter-spacing:.02em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 20px;border-radius:var(--r-md);border:2px solid var(--blue);background:var(--blue);color:var(--on-blue);font-weight:800;font-size:17px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--blue-strong);border-color:var(--blue-strong)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.soft{background:var(--orange-soft);border-color:var(--orange);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:40px;padding:4px 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.say{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:4px 12px;min-height:36px;font-weight:700;font-size:14px;cursor:pointer;vertical-align:middle}
.say svg{width:18px;height:18px}
.say.on{background:var(--orange);color:#1f2633}

/* space: the brand's navy sky */
.space{background-color:var(--navy-deep);color:var(--on-navy);background-image:
  radial-gradient(circle at 12% 18%,var(--star) 0 1.6px,transparent 2.4px),radial-gradient(circle at 30% 70%,var(--star) 0 1.2px,transparent 2px),
  radial-gradient(circle at 48% 12%,var(--star) 0 1px,transparent 1.8px),radial-gradient(circle at 62% 82%,var(--star) 0 1.6px,transparent 2.4px),
  radial-gradient(circle at 78% 30%,var(--star) 0 1.2px,transparent 2px),radial-gradient(circle at 90% 64%,var(--star) 0 1px,transparent 1.8px),
  radial-gradient(circle at 22% 44%,var(--star) 0 .9px,transparent 1.6px),radial-gradient(circle at 70% 52%,var(--star) 0 .9px,transparent 1.6px)}
.hero{border:0;position:relative;overflow:hidden;padding:22px}
.hero::after{content:"";position:absolute;width:96px;height:96px;border-radius:50%;background:var(--coral);left:-40px;bottom:-44px;box-shadow:inset -16px -12px 0 rgba(0,0,0,.14)}
.hero::before{content:"";position:absolute;width:150px;height:34px;border:3px solid var(--orange);border-radius:50%;left:-66px;bottom:-4px;transform:rotate(-18deg);opacity:.6;z-index:1}
.hero-in{position:relative;z-index:2;display:flex;gap:14px;align-items:center;padding-inline-end:40px}
.hero-in > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hero-in .mascot{width:88px;flex:none}
.hero h1{color:var(--on-navy);font-size:30px}
.hero .eyebrow{color:var(--orange)}

/* Nawwar, the bulb guide */
.mascot{display:block;height:auto;overflow:visible}
@media (prefers-reduced-motion:no-preference){
  .mascot.glow .rays{animation:glow 1.1s ease-out 2;transform-origin:50px 46px}
  @keyframes glow{0%{opacity:.15;transform:scale(.8)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:none}}
  .bob{animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  .onb-slide{animation:enter .35s ease-out}
}

/* onboarding: shown on every launch */
.onb{position:fixed;inset:0;z-index:30;overflow-y:auto;display:flex;flex-direction:column;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.onb::after{content:"";position:fixed;width:220px;height:220px;border-radius:50%;background:var(--coral);left:-90px;bottom:-110px;box-shadow:inset -22px -16px 0 rgba(0,0,0,.14);pointer-events:none}
.onb-top{display:flex;justify-content:space-between;align-items:center;max-width:560px;width:100%;margin:0 auto}
.onb-brand{font-weight:800;font-size:20px;color:var(--on-navy)}
.onb-skip{background:none;border:2px solid rgba(255,248,242,.35);color:var(--on-navy);border-radius:999px;padding:6px 16px;min-height:44px;font-weight:700;cursor:pointer}
.onb-slide{flex:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-block:16px;position:relative;z-index:1}
.onb-slide .mascot{width:150px}
.onb-slide h1{color:var(--on-navy);font-size:40px;line-height:1.2}
.onb-slide h1 .o{color:var(--orange)}
.onb-slide p{font-size:19px;max-width:30em}
.onb-slide .eyebrow{color:var(--orange);font-size:16px}
.planets{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;max-width:440px}
.planet{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;font-size:14px;font-weight:700}
.planet i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:#1f2633;box-shadow:inset -6px -5px 0 rgba(0,0,0,.14)}
.planet:nth-child(3n+1) i{background:var(--orange)} .planet:nth-child(3n+2) i{background:var(--coral)} .planet:nth-child(3n) i{background:#8fbcf8}
.onb-foot{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:10px;height:10px;border-radius:999px;background:rgba(255,248,242,.35);transition:width .2s}
.dots i.on{width:28px;background:var(--orange)}
.onb .btn,.who .btn{background:var(--orange);border-color:var(--orange);color:#1f2633}
.onb .btn:hover,.who .btn:hover{background:#ffa255;border-color:#ffa255}
.onb .btn.ghost,.who .btn.ghost{background:transparent;border-color:rgba(255,248,242,.5);color:var(--on-navy)}
.onb-foot .row > .btn{flex:1}

/* who is studying */
.who{border-radius:var(--r-lg);padding:24px 20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.who h1{color:var(--on-navy)}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.who-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:var(--r-md);border:2px solid rgba(255,248,242,.18);background:rgba(255,248,242,.06);color:var(--on-navy);cursor:pointer;font-weight:800;font-size:18px;min-width:0}
.who-card:hover{border-color:var(--orange)}
.who-card svg{width:64px;height:64px}
.who-card .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-card .sub{font-size:13px;font-weight:500;opacity:.8}
.who-card.add{border-style:dashed}
.who-card .plus{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,248,242,.12);font-size:36px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.field > .lb{font-weight:800}
.who input[type=text]{background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:var(--r-md);padding:10px 14px;font-size:20px;width:100%}
.who .err{color:#ffb4a8;font-weight:700;font-size:15px}
.av-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.av-grid label{display:grid;place-items:center;cursor:pointer;border-radius:50%;padding:3px;border:3px solid transparent}
.av-grid label svg{width:100%;max-width:58px;height:auto}
.av-grid input,.seg input{position:absolute;opacity:0;pointer-events:none}
.av-grid input:checked + label{border-color:var(--orange)}
.av-grid input:focus-visible + label,.seg input:focus-visible + label{outline:3px solid var(--orange);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg label{display:grid;place-items:center;min-height:48px;border-radius:var(--r-md);border:2px solid rgba(255,248,242,.3);font-weight:800;cursor:pointer}
.seg input:checked + label{background:var(--orange);border-color:var(--orange);color:#1f2633}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* grade picker */
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grade{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px;white-space:nowrap;padding:16px 8px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);cursor:pointer;min-height:96px}
.grade .n{font-size:30px;font-weight:800;line-height:1;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#1f2633;box-shadow:inset -8px -6px 0 rgba(0,0,0,.14)}
.p4{background:var(--coral)} .p5{background:var(--orange)} .p6{background:#8fbcf8}
.grade[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.go{background:var(--orange-soft);color:var(--orange-ink)}
.chip.info{background:var(--blue-soft);color:var(--blue)}

.lesson-item{display:flex;gap:14px;align-items:center;text-align:right;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:14px;cursor:pointer}
.lesson-item:hover{border-color:var(--blue)}
.lesson-item .t{font-weight:800;font-size:19px}
.lesson-item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.unit-h{font-size:17px;color:var(--muted);font-weight:800;margin-top:4px}
.continue{border-color:var(--blue)}

/* journey rail */
.rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px 0;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.rail .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;color:var(--muted)}
.rail button.done .dot{background:var(--orange);border-color:var(--orange);color:#1f1300}
.rail button.cur .dot{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.rail button.cur{color:var(--blue)}
.rail button[disabled]{cursor:default;opacity:.6}
.meter{display:block;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--orange);border-radius:999px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:15px}
.steps li.hl .k{background:var(--orange);color:#1f1300}
.term{font-weight:800;color:var(--blue)}

/* questions */
.q{display:flex;flex-direction:column;gap:12px}
.q .stem{font-weight:700;font-size:20px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;width:100%;min-height:54px;padding:8px 14px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:15px}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.picked{border-color:var(--blue);background:var(--blue-soft)}
.opt[disabled]{cursor:default}
.fb{display:flex;flex-direction:column;gap:10px}
.fb:empty{display:none}
.box{border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.box.hint{background:var(--orange-soft)}
.box.good{background:var(--good-soft)}
.box.good b.h{color:var(--good)}
.box.think{background:var(--surface-2);border:2px dashed var(--line)}
.box .h{font-weight:800}
.box.talk{flex-direction:row;align-items:flex-start;gap:12px}
.box.talk > .mascot{flex:none;width:52px}
.box.talk > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs > div{border-radius:var(--r-sm);padding:10px;background:var(--surface);min-width:0}
.vs .x{color:var(--bad);font-weight:800;font-size:14px}
.vs .y{color:var(--good);font-weight:800;font-size:14px}

/* simulation */
.cups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cup{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.cup svg{width:100%;max-width:150px;height:auto}
.cup .lab{font-weight:800;font-size:16px}
.cup .obs{font-size:14px;color:var(--muted);line-height:1.5;min-height:3em}
.day{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.day input[type=range]{flex:1;min-width:160px;accent-color:var(--blue);height:32px}
.day output{font-weight:800;font-size:19px;color:var(--blue);min-width:5em;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px;text-align:right;vertical-align:top}
th{background:var(--surface-2)}

.video{border-radius:var(--r-md);overflow:hidden;background:var(--surface-2);aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;text-align:center;padding:16px}
.video iframe{width:100%;height:100%;border:0}
.video.has{padding:0}

/* profile */
.skills{display:grid;gap:10px}

<script type="text/plain" id="gs-code">
/**
 * فضاء العلوم: كود جدول Google Sheets.
 * بيستقبل 3 حاجات من التطبيق:
 *   1) تقدم الطلاب  -> شيت «الطلاب»
 *   2) صور حلول الطلاب -> فولدر في Google Drive بتاعك + شيت «الحلول»
 *   3) «صوّر سؤال»   -> بيسأل Gemini ويرجّع تلميحات (مقفول لحد ما تفتحيه)
 *
 * الإعداد:
 * 1) غيّري أكواد الفصول تحت (حروف إنجليزي وأرقام، من 4 لـ 12).
 * 2) Deploy > New deployment > Web app: Execute as "Me"، Who has access "Anyone".
 *    (لو بتحدّثي كود قديم: Deploy > Manage deployments > تعديل > Version: New version)
 * 3) لتشغيل «صوّر سؤال»: Project Settings > Script Properties وضيفي:
 *      GEMINI_API_KEY = مفتاحك (ما تكتبيهوش في الكود ولا تبعتيه لحد)
 *      AI_ENABLED     = true
 *    وبعدين شغّلي الدالة testAI من فوق علشان تتأكدي إنه شغال.
 * الجدول بيستقبل بس، ومش بيرجّع أسماء الطلاب ولا صورهم لأي حد.
 */
var CLASS_CODES = ["FADAA5A"];
var SHEET_NAME = "الطلاب";
var HEADERS = ["معرّف الطالب", "الاسم", "الصف", "كود الفصل", "الدروس اللي خلّصها", "الدرس الحالي", "المحطة", "مهارات أتقنها", "مهارات محتاجة تدريب", "أفكار محتاجة مراجعة", "عدد الشارات", "آخر نشاط", "موافقة ولي الأمر", "آخر تحديث"];
var SOLUTIONS_SHEET = "الحلول";
var SOLUTIONS_HEADERS = ["التاريخ", "معرّف الطالب", "الاسم", "كود الفصل", "الدرس", "ملاحظة الطالب", "رابط الصورة", "الحالة"];
var ASKS_SHEET = "أسئلة الكاميرا";
var ASKS_HEADERS = ["التاريخ", "الاسم", "كود الفصل", "المفهوم", "ملخص الرد"];
var FOLDER_NAME = "فضاء العلوم - حلول الطلاب";
var MAX_IMAGE_CHARS = 2800000;   // حوالي 2 ميجا
var ASK_LIMIT = 8;               // أقصى عدد أسئلة بالكاميرا لكل طالب كل 6 ساعات
var DEFAULT_MODEL = "gemini-flash-latest";

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    var d = JSON.parse(e.postData.contents);
    var code = String(d.classCode || "").trim().toUpperCase();
    var allowed = CLASS_CODES.map(function (c) { return String(c).trim().toUpperCase(); });
    if (allowed.indexOf(code) < 0) return reply({ ok: false, error: "bad_code" });
    if (d.consent !== true) return reply({ ok: false, error: "no_consent" });
    var id = String(d.id || "");
    if (!/^s[a-z0-9]{4,30}$/.test(id)) return reply({ ok: false, error: "bad_id" });

    if (d.type === "ask") return handleAsk(d, id, code);

    lock.waitLock(10000);
    if (d.type === "solution") return handleSolution(d, id, code);
    return handleProgress(d, id, code);
  } catch (err) {
    return reply({ ok: false, error: "server" });
  } finally {
    try { lock.releaseLock(); } catch (_) {}
  }
}

function doGet() {
  return reply({ ok: true, app: "fadaa", ai: aiEnabled() });
}

/* ---------- 1) التقدم ---------- */
function handleProgress(d, id, code) {
  var row = [id, clean(d.name, 20), clean(d.grade, 20), code, clean(d.lessonsDone, 400), clean(d.current, 120), clean(d.stage, 30),
    clean(d.mastered, 300), clean(d.practice, 300), clean(d.ideas, 600), Number(d.badges) || 0, clean(d.lastActive, 40), clean(d.consentAt, 40), new Date()];
  var sh = getSheet(SHEET_NAME, HEADERS);
  var last = sh.getLastRow();
  var ids = last > 1 ? sh.getRange(2, 1, last - 1, 1).getValues() : [];
  for (var i = 0; i < ids.length; i++) {
    if (ids[i][0] === id) { sh.getRange(i + 2, 1, 1, row.length).setValues([row]); return reply({ ok: true }); }
  }
  sh.appendRow(row);
  return reply({ ok: true });
}

/* ---------- 2) صورة الحل للمعلمة ---------- */
function handleSolution(d, id, code) {
  if (d.photoConsent !== true) return reply({ ok: false, error: "no_consent" });
  var img = String(d.image || "");
  if (!img || img.length > MAX_IMAGE_CHARS || !/^[A-Za-z0-9+/=]+$/.test(img)) return reply({ ok: false, error: "too_big" });
  var name = clean(d.name, 20), lesson = clean(d.lesson, 120);
  var stamp = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), "yyyy-MM-dd HH-mm");
  var blob = Utilities.newBlob(Utilities.base64Decode(img), "image/jpeg", name + " - " + lesson + " - " + stamp + ".jpg");
  var file = getFolder().createFile(blob);   // الملف خاص بيكِ؛ مش بيتشارك مع حد
  getSheet(SOLUTIONS_SHEET, SOLUTIONS_HEADERS).appendRow([new Date(), id, name, code, lesson, clean(d.note, 300), file.getUrl(), "لسه ما اتراجعش"]);
  return reply({ ok: true });
}

function getFolder() {
  var props = PropertiesService.getScriptProperties();
  var fid = props.getProperty("FOLDER_ID");
  if (fid) { try { return DriveApp.getFolderById(fid); } catch (_) {} }
  var folder = DriveApp.createFolder(FOLDER_NAME);
  props.setProperty("FOLDER_ID", folder.getId());
  return folder;
}

/* ---------- 3) «صوّر سؤال» مع Gemini ---------- */
var SYSTEM_PROMPT = [
  "إنت «نوّور»، مساعد علوم في تطبيق «فضاء العلوم» لطلاب الصف الرابع والخامس والسادس الابتدائي في مصر (من 9 لـ 12 سنة).",
  "الطالب صوّر سؤال أو جزء من كتاب. مهمتك تساعده يفهم ويفكّر، مش تدّيله الإجابة النهائية.",
  "اكتب بالعامية المصرية البسيطة، والمصطلحات العلمية بالفصحى. جمل قصيرة. من غير إيموجي.",
  "ممنوع تكتب الإجابة النهائية أو تختار الاختيار الصح. اشرح الفكرة اللي السؤال بيقيسها، وادّي تلميحات متدرجة.",
  "لو الصورة مش سؤال علوم، أو مش واضحة، أو فيها وشوش أو بيانات شخصية: is_science=false واكتب رسالة لطيفة في message، وما توصفش الأشخاص.",
  "لو مش متأكد من معلومة علمية: unsure=true، وما تخترعش معلومات، وقول له يسأل المعلمة.",
  "رد بـ JSON بس بالشكل ده بالظبط:",
  '{"is_science":true,"unsure":false,"question":"السؤال بكلامك في سطر","concept":"اسم المفهوم","explain":"شرح الفكرة في 2-3 جمل من غير الإجابة","hint1":"تلميح أول","hint2":"تلميح أقرب للحل من غير ما تقوله","check":"سؤال صغير يتأكد بيه إنه فهم","message":""}'
].join("\n");

function handleAsk(d, id, code) {
  if (!aiEnabled()) return reply({ ok: false, error: "ai_off" });
  if (d.photoConsent !== true) return reply({ ok: false, error: "no_consent" });
  var img = String(d.image || "");
  if (!img || img.length > MAX_IMAGE_CHARS || !/^[A-Za-z0-9+/=]+$/.test(img)) return reply({ ok: false, error: "too_big" });
  var cache = CacheService.getScriptCache(), ck = "ask_" + id, used = Number(cache.get(ck) || 0);
  if (used >= ASK_LIMIT) return reply({ ok: false, error: "too_many" });
  cache.put(ck, String(used + 1), 21600);
  var userText = "صف الطالب: " + clean(d.grade, 20) + (d.text ? ("\nالطالب كتب: " + clean(d.text, 300)) : "");
  var out = callGemini(img, userText);   // الصورة مش بتتحفظ في أي مكان
  if (!out) return reply({ ok: false, error: "ai_error" });
  try {
    getSheet(ASKS_SHEET, ASKS_HEADERS).appendRow([new Date(), clean(d.name, 20), code, clean(out.concept, 80), clean(out.question || out.message, 200)]);
  } catch (_) {}
  return reply({ ok: true, answer: out });
}

function aiEnabled() {
  var p = PropertiesService.getScriptProperties();
  return p.getProperty("AI_ENABLED") === "true" && !!p.getProperty("GEMINI_API_KEY");
}

function callGemini(imageB64, userText) {
  var p = PropertiesService.getScriptProperties();
  var model = p.getProperty("GEMINI_MODEL") || DEFAULT_MODEL;
  var url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent";
  var parts = [{ text: userText }];
  if (imageB64) parts.unshift({ inline_data: { mime_type: "image/jpeg", data: imageB64 } });
  var res = UrlFetchApp.fetch(url, {
    method: "post", contentType: "application/json", muteHttpExceptions: true,
    headers: { "x-goog-api-key": p.getProperty("GEMINI_API_KEY") },
    payload: JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: [{ role: "user", parts: parts }],
      generationConfig: { temperature: 0.4, maxOutputTokens: 800, responseMimeType: "application/json" }
    })
  });
  if (res.getResponseCode() !== 200) { console.log("Gemini " + res.getResponseCode() + ": " + res.getContentText().slice(0, 300)); return null; }
  try {
    var body = JSON.parse(res.getContentText());
    var text = body.candidates[0].content.parts.map(function (x) { return x.text || ""; }).join("");
    var o = JSON.parse(text.replace(/^```(json)?|```$/g, "").trim());
    var keys = ["question", "concept", "explain", "hint1", "hint2", "check", "message"], safe = { is_science: o.is_science !== false, unsure: !!o.unsure };
    keys.forEach(function (k) { safe[k] = clean(o[k], 500); });
    return safe;
  } catch (err) { console.log("parse: " + err); return null; }
}

/** شغّليها من المحرر (Run) علشان تتأكدي إن المفتاح والموديل شغالين. */
function testAI() {
  var out = callGemini("", "صف الطالب: الخامس\nالطالب كتب: ليه البذرة الناشفة ما بتنبتش؟");
  console.log(out ? "شغال: " + JSON.stringify(out) : "مش شغال. بصّي على السطر اللي فوق علشان تعرفي السبب.");
}

/* ---------- أدوات ---------- */
function getSheet(name, headers) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  if (sh.getLastRow() === 0) { sh.appendRow(headers); sh.setFrozenRows(1); sh.setRightToLeft(true); }
  return sh;
}

function clean(v, max) {
  var s = String(v == null ? "" : v).replace(/[\u0000-\u001f]/g, " ").slice(0, max);
  return /^[=+\-@]/.test(s) ? "'" + s : s;
}

function reply(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
</script>

var SEED_LESSON = {

  published: true, reviewed: false, curriculumVerified: false, curriculumSource: "",
  grade: "5", term: "الفصل الدراسي الأول", unit: "احتياجات النبات",

/* ================= الأدلة والمهارات ================= */
function addEvidence(qid, score, ctx, lid){
  var q = C.questions[qid]; if (!q || !S) return;
  var t = now();
  S.evidence.push({q: qid, skill: q.skill, score: score, t: t, ctx: ctx, lesson: lid});
  if (ctx === "review" && S.lastSeen[qid] && t - S.lastSeen[qid] >= 20*3600*1000) S.evidence.push({q: qid, skill: "recall", score: score, t: t, ctx: "recall", lesson: lid});
  S.lastSeen[qid] = t;
}
function skillStatus(id, st, lid){
  st = st || S;
  var ev = st.evidence.filter(function(e){ return e.skill === id && (!lid || e.lesson === lid); });
  var cnt = ev.length, avg = cnt ? ev.reduce(function(a,e){ return a + e.score; }, 0) / cnt : 0;
  var r;
  if (cnt < 2) r = {k: "few", label: id === "recall" ? "هتتقاس في المراجعة بعد يوم" : "لسه محتاجين أدلة أكتر", cls: ""};
  else if (avg >= 0.75) r = {k: "mastered", label: "أتقنتها", cls: "ok"};
  else if (avg >= 0.45) r = {k: "growing", label: "في الطريق", cls: "info"};
  else r = {k: "practice", label: "محتاجة تدريب كمان", cls: "go"};
  r.count = cnt; r.avg = avg; return r;
}
function countMastered(st, lid){ return C.skills.filter(function(s){ return skillStatus(s.id, st, lid).k === "mastered"; }).length; }
function schedule(qid, delayDays, isRecall, lid){
  var r = S.review[qid];
  if (r && !isRecall) { r.step = 0; r.due = now() + DAY; return; }
  if (r && isRecall) return;
  S.review[qid] = {step: 0, due: now() + delayDays*DAY, recall: !!isRecall, lesson: lid};
}
function dueList(){ var t = now(), out = []; if (!S) return out; for (var id in S.review) if (S.review[id].due <= t && C.questions[id]) out.push(id); return out; }
function reviewAnswered(qid, score){
  var r = S.review[qid]; if (!r) return;
  var gaps = [3, 7];
  if (score === 1) { if (r.step >= gaps.length) { delete S.review[qid]; return; } r.due = now() + gaps[r.step]*DAY; r.step++; }
  else { r.step = 0; r.due = now() + DAY; }
}

/* ================= سؤال مع «اكشف تفكيرك» ================= */
/* opts: {ctx, onDone(score), allowTwin, lid} */
function mountQuestion(host, qid, opts){
  opts = opts || {};
  var lid = opts.lid || L().id;
  var q = C.questions[qid], tries = 0, finished = false, lastWrongM = null;
  host.innerHTML = '<div class="q"><p class="stem">' + esc(q.stem) + ' ' + sayBtn(q.stem + "، " + q.options.map(function(o, k){ return LET[k] + "، " + o.t; }).join("، ")) + '</p><div class="opts" role="group" aria-label="الاختيارات">' +
    q.options.map(function(o, i){ return '<button type="button" class="opt" data-i="' + i + '"><span class="l">' + LET[i] + '</span><span>' + esc(o.t) + '</span></button>'; }).join("") +
    '</div><div class="fb" aria-live="polite"></div><div class="twin"></div></div>';
  var fb = host.querySelector(".fb"), twinHost = host.querySelector(".twin");
  var btns = host.querySelectorAll(".opt");
  Array.prototype.forEach.call(btns, function(b){ b.onclick = function(){ pick(+b.getAttribute("data-i"), b); }; });

  function lock(){ Array.prototype.forEach.call(btns, function(b){ b.disabled = true; if (q.options[+b.getAttribute("data-i")].ok) b.classList.add("right"); }); }
  function pick(i, b){
    if (finished) return;
    stopSpeak();
    var o = q.options[i];
    if (o.ok) {
      finished = true; lock(); SND.ok();
      finish(tries === 0 ? 1 : (tries === 1 ? 0.5 : 0), tries === 0 ? cheer() : "برافو! فكّرت تاني ووصلت.");
      return;
    }
    tries++;
    b.classList.add("wrong"); b.disabled = true;
    if (o.m) { lastWrongM = o.m; S.misc[o.m] = (S.misc[o.m] || 0) + 1; save(); }
    if (tries <= 2 && q.hints && q.hints[tries-1]) {
      SND.hint();
      fb.innerHTML = talk("hint", "think", '<span class="h">قرّبت! خد تلميح ' + n(tries) + ' وجرّب تاني</span><p>' + esc(q.hints[tries-1]) + '</p>');
    } else { finished = true; lock(); finish(0, null, o); }
  }
  function finish(score, okText, wrongOpt){
    addEvidence(qid, score, opts.ctx || "lesson", lid);
    if (score < 1 && opts.ctx !== "review") schedule(qid, 1, false, lid);
    save();
    var html = okText
      ? talk("good", "cheer", '<b class="h">' + esc(okText) + '</b><p>' + esc(q.explain) + '</p>', "glow")
      : talk("good", "happy", '<b class="h">ولا يهمك، تعالى نفهمها سوا. الإجابة الصح: ' + esc(q.options.filter(function(o){return o.ok;})[0].t) + '</b><p>' + esc(q.explain) + '</p>');
    /* «اكشف تفكيرك»: التصور المحتمل يظهر كفرضية، مش حكم */
    var mid = wrongOpt && wrongOpt.m ? wrongOpt.m : lastWrongM;
    if (score < 1 && mid && C.misconceptions[mid]) {
      var mc = C.misconceptions[mid], les = lessonById(lid) || L();
      var vid = ytId(les.video && les.video.url), tsec = parseInt((les.videoTimes || {})[mid], 10);
      var link = (vid && tsec >= 0) ? ' <a href="https://www.youtube.com/watch?v=' + vid + '&t=' + tsec + 's" target="_blank" rel="noopener">شوف الجزء ده في الفيديو</a>' : "";
      html += '<div class="box think"><span class="h">اكشف تفكيرك</span><p class="small muted">ده احتمال من إجابة واحدة، مش حكم عليك.</p><div class="vs"><div><div class="x">ممكن تكون فكّرت إن</div>' + esc(mc.idea) + '</div><div><div class="y">العلم بيقول</div>' + esc(mc.correct) + '</div></div>' +
        '<p class="small"><button type="button" class="btn ghost sm" data-step="' + mc.step + '">ارجع لخطوة الشرح</button>' + link + '</p></div>';
    }
    fb.innerHTML = html;
    var sb = fb.querySelector("[data-step]");
    if (sb) sb.onclick = function(){ curLessonId = lid; var g = G(lid); g.stage = 2; g.highlight = +sb.getAttribute("data-step"); save(); go("lesson"); };
    if (score < 1 && q.twin && opts.allowTwin !== false && C.questions[q.twin]) {
      twinHost.innerHTML = '<div class="card" style="margin-top:8px;background:var(--surface-2)"><p class="eyebrow">سؤال شبيه نتأكد بيه</p><div class="tq"></div></div>';
      mountQuestion(twinHost.querySelector(".tq"), q.twin, {ctx: "twin", allowTwin: false, lid: lid, onDone: function(s2){
        if (s2 === 1) award("comeback");
        if (opts.onDone) opts.onDone(score);
      }});
    } else if (opts.onDone) opts.onDone(score);
    checkBadges();
  }
}

var SYNC_URL = "";
var KEY_SYNC = "fadaa.sync.v1";
function syncUrl(){ var o = load(KEY_SYNC); return (o && o.url) || SYNC_URL; }
var SYNC_ERR = {bad_code: "كود الفصل مش صح. اسأل المعلمة عن الكود.", no_consent: "محتاجين موافقة ولي الأمر الأول.", bad_id: "فيه مشكلة في الحساب. كلّم المعلمة.", server: "الجدول مش راضي يستقبل دلوقتي. هنحاول تاني بعدين.", offline: "مفيش إنترنت دلوقتي. هنبعت لما النت يرجع."};
function canSync(st){ return !!(st && syncUrl() && st.classCode && st.consent && st.syncError !== "bad_code" && st.syncError !== "no_consent"); }
function syncPayload(st){
  var pub = C.lessons.filter(function(l){ return l.published; });
  var done = pub.filter(function(l){ return st.progress[l.id] && st.progress[l.id].quizDone; }).map(function(l){ return l.title; });

  var ideas = Object.keys(st.misc).filter(function(k){ return st.misc[k] >= 2 && C.misconceptions[k]; }).map(function(k){ return C.misconceptions[k].idea; });
  return {id: st.id, name: st.name, grade: gradeName(st.grade), classCode: st.classCode, consent: true, consentAt: st.consentAt || "",
    lessonsDone: done.length + " من " + pub.length + (done.length ? ": " + done.join("، ") : ""), current: cur ? cur.title : "",
    stage: g ? (g.quizDone ? "خلّص الدرس" : STAGES[Math.min(g.stage, 6)]) : "", mastered: mastered.join("، "), practice: practice.join("، "),
    ideas: ideas.join(" | "), badges: st.badges.length, lastActive: new Date(st.last).toISOString()};
}
var syncTimer = null, syncBusy = false;
function queueSync(){
  if (!canSync(S)) return;
  S.syncDirty = true;
  clearTimeout(syncTimer);
  var st = S; syncTimer = setTimeout(function(){ runSync(st); }, 3000);
}
function runSync(st, cb){
  if (!canSync(st) || syncBusy) { if (cb) cb(false); return; }
  if (navigator.onLine === false) { st.syncError = "offline"; store(KEY_DB, DB); if (cb) cb(false); return; }
  syncBusy = true;
  fetch(syncUrl(), {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(syncPayload(st))})
    .then(function(r){ return r.json(); })
    .then(function(res){
      syncBusy = false;
      if (res && res.ok) { st.syncDirty = false; st.syncedAt = now(); st.syncError = ""; } else st.syncError = (res && SYNC_ERR[res.error]) ? res.error : "server";
      store(KEY_DB, DB); if (cb) cb(!!(res && res.ok));
    })
    .catch(function(){ syncBusy = false; st.syncError = "offline"; store(KEY_DB, DB); if (cb) cb(false); });
}
function syncAllDirty(){ DB.list.forEach(function(st){ if (st.syncDirty && canSync(st)) runSync(st); }); }
window.addEventListener("online", syncAllDirty);
function syncStatusText(st){
  if (!st.classCode) return "";
  if (st.syncError && st.syncError !== "offline") return SYNC_ERR[st.syncError] || SYNC_ERR.server;
  if (st.syncDirty) return st.syncError === "offline" ? SYNC_ERR.offline : "فيه تقدم جديد هيتبعت للمعلمة بعد شوية.";
  return st.syncedAt ? "المعلمة شايفة تقدمك. آخر إرسال: " + ago(st.syncedAt) + "." : "لسه ما اتبعتش حاجة.";

function compressImage(file, cb){
  var fr = new FileReader();
  fr.onerror = function(){ cb(null); };
  fr.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(null); };
    img.onload = function(){
      var max = 1280, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var cv = document.createElement("canvas"); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
      var cx = cv.getContext("2d"); cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      var q = 0.72, url = cv.toDataURL("image/jpeg", q);
      while (url.length > 2600000 && q > 0.35) { q -= 0.12; url = cv.toDataURL("image/jpeg", q); }
      cb(url);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

}
function renderAI(out, a){

  out.innerHTML = '<section class="card"><span class="ai-tag">رد من ذكاء اصطناعي، ممكن يغلط. راجع مع المعلمة.</span>' +
    (a.unsure ? '<p class="flag"><span><b>نوّور مش متأكد</b> من الإجابة دي. اسأل المعلمة.</span></p>' : '') +
    (a.question ? '<p><b>السؤال:</b> ' + esc(a.question) + '</p>' : '') +
    (a.concept ? '<p><span class="chip info">' + esc(a.concept) + '</span></p>' : '') +
    talk("hint", "happy", '<span class="h">الفكرة</span><p>' + esc(a.explain) + '</p>' + (a.explain ? sayBtn(a.explain) : '')) +
    (a.hint1 ? talk("hint", "think", '<span class="h">تلميح ١</span><p>' + esc(a.hint1) + '</p>') : '') +
    (a.hint2 ? '<div id="h2"><button class="btn soft" type="button" id="more">لسه مش عارف؟ تلميح تاني</button></div>' : '') +
    (a.check ? '<div class="box think"><span class="h">جرّب تجاوب في دماغك</span><p>' + esc(a.check) + '</p></div>' : '') +
    '<div class="row"><button class="btn ghost" type="button" id="to-sol">حليت؟ ابعت حلّك للمعلمة</button></div></section>';
  var mb = document.getElementById("more"); if (mb) mb.onclick = function(){ document.getElementById("h2").innerHTML = talk("hint", "think", '<span class="h">تلميح ٢</span><p>' + esc(a.hint2) + '</p>'); };

    '<button type="button" class="flash' + (cs.flipped ? " flipped" : "") + '" id="flash" aria-label="' + (cs.flipped ? "الإجابة: " + esc(c.b) : "السؤال: " + esc(c.f) + ". اضغط علشان تشوف الإجابة") + '"><span class="flash-in"><span class="face front">' + esc(c.f) + '<small>اضغط علشان تقلبها</small></span><span class="face back">' + esc(c.b) + '</span></span></button>' +
    '<div class="row" style="justify-content:center">' + sayBtn(cs.flipped ? c.b : c.f) + '</div>' +
    (cs.flipped ? '<div class="row"><button class="btn" type="button" id="knew" style="flex:1">عرفتها</button><button class="btn soft" type="button" id="notyet" style="flex:1">لسه، رجّعها تاني</button></div>' : '<p class="note">فكّر في الإجابة الأول، وبعدين اقلب البطاقة.</p>') + '</div>';

function drawCertificate(l, cb){
  var W = 1200, H = 850, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  var x = cv.getContext("2d"), F = '"Baloo Bhaijaan 2", Tajawal, Tahoma, sans-serif';
  var mastered = countMastered(S, l.id), date = new Date().toLocaleDateString("ar-EG", {year: "numeric", month: "long", day: "numeric"});
  var img = new Image();
  function paint(withImg){
    x.clearRect(0, 0, W, H);
    x.fillStyle = "#fff8f2"; x.fillRect(0, 0, W, H);
    x.strokeStyle = "#1d2a42"; x.lineWidth = 14; roundRect(x, 20, 20, W - 40, H - 40, 34); x.stroke();
    x.strokeStyle = "#f08a2e"; x.lineWidth = 4; roundRect(x, 44, 44, W - 88, H - 88, 24); x.stroke();
    x.fillStyle = "#1d2a42"; for (var i = 0; i < 26; i++) { x.beginPath(); x.arc(70 + (i * 397) % (W - 140), 70 + (i * 173) % 110, (i % 3) + 1.5, 0, 7); x.fill(); }
    x.beginPath(); x.fillStyle = "#f07f55"; x.arc(110, H - 110, 70, 0, 7); x.fill();
    x.strokeStyle = "#f08a2e"; x.lineWidth = 5; x.beginPath(); x.ellipse(110, H - 110, 120, 26, -0.3, 0, 7); x.stroke();
    x.direction = "rtl"; x.textAlign = "center"; x.textBaseline = "alphabetic";
    function t(str, y, size, color, weight){ x.font = (weight || 800) + " " + size + "px " + F; x.fillStyle = color; x.fillText(str, W / 2, y, W - 260); }
    t("فضاء العلوم", 150, 44, "#0b5cc9");
    t("شهادة إتمام رحلة", 240, 64, "#1d2a42");
    t("الشهادة دي لـ", 315, 30, "#5b6476", 600);
    t(S.name, 420, 96, "#0b5cc9");
    t("خلّص رحلة محقق العلوم في درس", 495, 32, "#1f2633", 600);
    t("«" + l.title + "»", 565, 46, "#9a4a06");
    t("وأتقن " + n(mastered) + " من " + n(C.skills.length) + " مهارات علمية", 635, 32, "#1d7447", 700);
    t(date, 720, 26, "#5b6476", 600);
    if (C.certificate && C.certificate.teacher) t("المعلمة: " + C.certificate.teacher, 765, 26, "#1d2a42", 700);
    if (withImg) x.drawImage(img, W - 260, H - 300, 180, 202);
  }
  function exportIt(retry){
    try { cv.toBlob(function(b){ cb(b ? URL.createObjectURL(b) : cv.toDataURL("image/png")); }, "image/png"); }
    catch(e){ if (retry) { paint(false); exportIt(false); } }
  }
  var fontReady = (document.fonts && document.fonts.load) ? document.fonts.load('800 40px "Baloo Bhaijaan 2"').catch(function(){}) : Promise.resolve();
  var imgReady = new Promise(function(res){ img.onload = function(){ res(true); }; img.onerror = function(){ res(false); }; });
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(mascot("cheer").replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="225" '));
  Promise.all([fontReady, imgReady]).then(function(r){ paint(r[1]); exportIt(true); });
}
function roundRect(x, X, Y, w, h, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }

function cupSVG(cup, day){

  var flooded = cup.id === "flooded", moist = cup.id === "moist";
  var g = '<svg viewBox="0 0 120 150" role="img" aria-label="' + esc(cup.label) + '، اليوم ' + day + '">';
  g += '<path d="M14 30h92l-10 112H24z" fill="var(--cup)" stroke="var(--cup-line)" stroke-width="2.5" stroke-linejoin="round"/>';
  if (flooded) g += '<path d="M18.6 58h82.8L96 142H24z" fill="var(--water)" opacity=".75"/>';
  g += '<ellipse cx="60" cy="128" rx="34" ry="10" fill="var(--cotton)" stroke="var(--cup-line)" stroke-width="1.5"/>';
  if (moist) g += '<ellipse cx="60" cy="131" rx="30" ry="6" fill="var(--water)" opacity=".55"/>';
  var sy = 118, fill = rot ? "var(--seed-rot)" : (s >= 1 ? "var(--seed-wet)" : "var(--seed)");
  var rx = s >= 1 ? 14 : 10, ry = s >= 1 ? 9.5 : 7;
  if (s >= 3) g += '<path d="M58 ' + (sy+7) + ' C 57 ' + (sy+11) + ', 56 ' + (sy+14) + ', ' + (s >= 4 ? "50 " + (sy+27) : "54 " + (sy+18)) + '" stroke="var(--root-line)" stroke-width="4.5" fill="none" stroke-linecap="round"/>';

  };

/* ================= QR لرابط الطلاب ================= */
var KEY_SHARE = "fadaa.share.v1";
var QR_LIB = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
function loadQR(cb){
  if (window.qrcode) { cb(true); return; }
  var sc = document.createElement("script"); sc.src = QR_LIB;
  sc.onload = function(){ cb(!!window.qrcode); }; sc.onerror = function(){ cb(false); };
  document.head.appendChild(sc);
}
function qrSVG(text){
  var qr = window.qrcode(0, "H"); qr.addData(text); qr.make();
  var n = qr.getModuleCount(), q = 4, size = n + q*2, d = "";
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += "M" + (c+q) + " " + (r+q) + "h1v1h-1z";
  /* لمبة صغيرة في النص؛ مستوى تصحيح الأخطاء H بيستحمل الجزء ده */
  var lw = Math.round(n * 0.22), lx = (size - lw) / 2, cx = size / 2, k = lw / 32;
  var logo = '<rect x="' + lx + '" y="' + lx + '" width="' + lw + '" height="' + lw + '" rx="' + (lw*0.22) + '" fill="#ffffff"/>' +
    '<g transform="translate(' + (cx - 16*k) + ' ' + (cx - 16*k) + ') scale(' + k + ')"><circle cx="16" cy="16" r="15" fill="#1d2a42"/><path d="M16 7a6.5 6.5 0 0 0-3.8 11.8c.6.5 1 1.2 1 2V22h5.6v-1.2c0-.8.4-1.5 1-2A6.5 6.5 0 0 0 16 7z" fill="#f08a2e"/><rect x="13" y="23.2" width="6" height="2.4" rx="1.2" fill="#f08a2e"/></g>';
  return '<svg class="qr" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="رمز QR لرابط التطبيق" shape-rendering="crispEdges"><rect width="' + size + '" height="' + size + '" fill="#ffffff"/><path d="' + d + '" fill="#1d2a42"/>' + logo + '</svg>';
}

    '<label class="f" for="sh-link">رابط التطبيق<input type="url" id="sh-link" dir="ltr" placeholder="https://….github.io/fadaa-eloloum/" value="' + esc(saved.link || here) + '"></label>' +

    '<section class="card"><h2>الشهادة</h2><p class="small muted">الطالب بياخد شهادة باسمه لما يخلّص رحلة الدرس. اسمك بيظهر عليها لو كتبتيه هنا.</p><label class="f" for="ce-t">اسمك على الشهادة (اختياري)<input type="text" id="ce-t" maxlength="40" value="' + esc((C.certificate || {}).teacher || "") + '"></label><div class="row"><button class="btn ghost" type="button" id="ce-save">احفظي</button></div></section>';

  document.getElementById("sh-make").onclick = function(){

    store(KEY_SHARE, {link: link, code: code});
    msg("بنجهّز الـ QR...", true);
    loadQR(function(ok){
      if (!ok) { msg("محتاجين إنترنت علشان نعمل الـ QR أول مرة. اتصلي بالنت وجرّبي تاني.", false); return; }
      var warn = /claude\.ai/.test(link) ? '<p class="flag"><span><b>تنبيه:</b> رابط claude.ai ده خاص بيكِ. الطلاب مش هيقدروا يفتحوه إلا لو شاركتيه، والربط بالجدول مش هيشتغل منه. الأفضل رابط GitHub Pages.</span></p>' : "";
      document.getElementById("sh-out").innerHTML = warn +
        '<div class="poster" id="poster"><div class="pt"><span>فضاء</span> العلوم</div><p class="cap">صوّر الكود بكاميرا الموبايل</p>' + qrSVG(link) +
        '<ol><li>افتح الرابط واعدّي شاشة الترحيب.</li><li>اكتب اسمك الأول.</li>' + (code ? '<li>اكتب كود الفصل:</li></ol><div class="code">' + esc(code) + '</div>' : '</ol>') +
        '<p class="lnk">' + esc(link) + '</p></div>' +
        '<div class="row" style="justify-content:center">' + (inClaude() ? '<p class="small muted">اعملي سكرين شوت للكارت وابعتيه للطلاب.</p>' : '<button class="btn ghost" type="button" id="sh-print">اطبعي الكارت</button><p class="small muted">أو اعملي سكرين شوت وابعتيه للطلاب.</p>') + '</div>';
      var pr = document.getElementById("sh-print"); if (pr) pr.onclick = function(){ window.print(); };
      msg("الـ QR جاهز. جرّبيه بكاميرا موبايلك قبل ما تبعتيه.", true);
    });
  };
  document.getElementById("ce-save").onclick = function(){ C.certificate = C.certificate || {}; C.certificate.teacher = document.getElementById("ce-t").value.trim(); saveContent(); toast("اتحفظ"); };
  if (saved.link) document.getElementById("sh-make").click();
}

function twoStepEl(b, confirmText, fn){
  var orig = b.textContent, armed = false, t;
  b.onclick = function(){
    if (!armed) { armed = true; b.textContent = confirmText; t = setTimeout(function(){ armed = false; b.textContent = orig; }, 4000); return; }
    clearTimeout(t); armed = false; b.textContent = orig; fn();
  };
}
